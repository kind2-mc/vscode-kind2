
name: Publish release

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      pre-release-flag: ${{ steps.check.outputs.flag }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Check release type
      id: check
      # Odd minor versions are pre-releases, even minor versions are stable
      run: |
        version=$(node -p "require('./package.json').version")
        minor=$(echo "$version" | cut -d. -f2)
        if [ $((minor % 2)) -eq 1 ]; then
          echo "Version $version is a pre-release build"
          echo "flag=--pre-release" >> "$GITHUB_OUTPUT"
        else
          echo "Version $version is a stable build"
          echo "flag=" >> "$GITHUB_OUTPUT"
        fi

  build:
    runs-on: ubuntu-latest
    needs: version
    strategy:
      matrix:
        platform: [linux-x64, linux-arm64, darwin-x64, darwin-arm64, win32-x64]
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        include:
          - platform: linux-x64
            kind2_asset: kind2-linux-x86_64.tar.gz
          - platform: linux-arm64
            kind2_asset: kind2-linux-arm64.tar.gz
          - platform: darwin-x64
            kind2_asset: kind2-macos-12-x86_64.tar.gz
          - platform: darwin-arm64
            kind2_asset: kind2-macos-12-arm64.tar.gz
          - platform: win32-x64
            kind2_asset: kind2-windows-x86_64.zip
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'
    - name: Download development build of Kind 2
      # Pre-releases ship the current main branch of Kind 2, like CI does.
      # configure.sh skips its own Kind 2 download when ./kind2 already exists,
      # so stable releases keep using the pinned Kind 2 release.
      if: needs.version.outputs.pre-release-flag == '--pre-release'
      run: |
        wget https://github.com/kind2-mc/kind2/releases/download/latest/${{ matrix.kind2_asset }}
        case "${{ matrix.kind2_asset }}" in
          *.zip) unzip -o ${{ matrix.kind2_asset }};;
          *)     tar -xf ${{ matrix.kind2_asset }};;
        esac
        rm ${{ matrix.kind2_asset }}
    - name: Configure dependencies
      run: ./configure.sh ${{ matrix.platform }}
    - name: Package extension
      run: npx vsce package --target ${{ matrix.platform }} ${{ needs.version.outputs.pre-release-flag }}
    - name: Upload extension artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.platform }}
        path: "*.vsix"

  publish:
    runs-on: ubuntu-latest
    needs: [version, build]
    if: success()
    steps:
      - name: Download extension artifacts
        uses: actions/download-artifact@v8
      - name: Publish extension
        run: npx vsce publish --packagePath $(find . -iname *.vsix) ${{ needs.version.outputs.pre-release-flag }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
