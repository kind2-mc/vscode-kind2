
name: Run CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux-x64, linux-arm64, darwin-x64, darwin-arm64, win32-x64]
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        include:
          - platform: linux-x64
            kind2_asset: kind2-linux-x86_64.tar.gz
          - platform: linux-arm64
            kind2_asset: kind2-linux-arm64.tar.gz
          - platform: darwin-x64
            kind2_asset: kind2-macos-12-x86_64.tar.gz
          - platform: darwin-arm64
            kind2_asset: kind2-macos-12-arm64.tar.gz
          - platform: win32-x64
            kind2_asset: kind2-windows-x86_64.zip
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'
    - name: Download development build of Kind 2
      # configure.sh skips its own Kind 2 download when ./kind2 already exists,
      # so CI tests against the current main branch instead of the pinned release.
      run: |
        wget https://github.com/kind2-mc/kind2/releases/download/latest/${{ matrix.kind2_asset }}
        case "${{ matrix.kind2_asset }}" in
          *.zip) unzip -o ${{ matrix.kind2_asset }};;
          *)     tar -xf ${{ matrix.kind2_asset }};;
        esac
        rm ${{ matrix.kind2_asset }}
    - name: Record Kind 2 commit
      # Kind 2 moves its 'latest' tag in place, so the tag (not the release's
      # target_commitish, which goes stale) identifies the downloaded build.
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api repos/kind2-mc/kind2/git/ref/tags/latest --jq .object.sha > kind2-sha.txt
        cat kind2-sha.txt
    - name: Configure dependencies
      run: ./configure.sh ${{ matrix.platform }}
    - name: Package extension
      # Omit the version from the file name so the release assets keep stable URLs.
      run: npx vsce package --target ${{ matrix.platform }} -o vscode-kind2-${{ matrix.platform }}.vsix
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.platform }}
        path: |
          *.vsix
          kind2-sha.txt

  release:
    runs-on: ubuntu-latest
    needs: build
    # Only publish from the main branch; pull request builds stay artifact-only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    # Serialize concurrent pushes so they cannot race while replacing the release.
    concurrency:
      group: latest-release
      cancel-in-progress: false
    steps:
      - name: Checkout pinned dependency versions
        uses: actions/checkout@v6
        with:
          sparse-checkout: configure.sh
          sparse-checkout-cone-mode: false
      - name: Download extension packages
        uses: actions/download-artifact@v8
        with:
          path: packages
      - name: Update the 'latest' pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          kind2_link() {
            echo "[\`${1:0:7}\`](https://github.com/kind2-mc/kind2/commit/$1)"
          }
          # Z3 and the language server are pinned in configure.sh, which every
          # build job ran from this same commit.
          z3_version=$(sed -n 's/^Z3_VERSION=//p' configure.sh)
          server_version=$(sed -n 's/^SERVER_VERSION=//p' configure.sh)
          # Each build job downloads Kind 2 on its own, so the platforms could
          # have picked up different builds if Kind 2 was updated in between.
          kind2_shas=$(cat packages/*/kind2-sha.txt | sort -u)
          {
            echo 'VSIX packages automatically built from the `main` branch on every push.'
            echo
            echo "Built from ${GITHUB_SHA:0:7} on $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo
            echo 'Includes:'
            if [ "$(echo "$kind2_shas" | wc -l)" -eq 1 ]; then
              echo "- Kind 2 $(kind2_link "$kind2_shas")"
            else
              echo '- Kind 2 (differs across platforms):'
              for sha in $kind2_shas; do
                platforms=$(grep -lx "$sha" packages/*/kind2-sha.txt \
                  | xargs -n1 dirname | xargs -n1 basename | paste -sd, - | sed 's/,/, /g')
                echo "  - $(kind2_link "$sha"): $platforms"
              done
            fi
            echo "- Z3 [$z3_version](https://github.com/Z3Prover/z3/releases/tag/z3-$z3_version)"
            echo "- Kind 2 language server [$server_version](https://github.com/kind2-mc/kind2-language-server/releases/tag/$server_version)"
          } > notes.md
          if gh release view latest >/dev/null 2>&1; then
            # Update in place. Deleting and re-creating the release would
            # publish it again, which e-mails everyone watching the
            # repository on every push to main.
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit latest \
              --prerelease \
              --title 'Kind 2 VS Code Extension (main branch)' \
              --notes-file notes.md
            # Asset names carry no version, so each upload replaces its
            # predecessor and nothing is left behind.
            gh release upload latest packages/*/*.vsix --clobber
          else
            gh release create latest packages/*/*.vsix \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title 'Kind 2 VS Code Extension (main branch)' \
              --notes-file notes.md
          fi
